name: Сборка Jarvis.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установка библиотек
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Проверка (протоколы, голос, инструменты)
        run: python tests/smoke_test.py

      - name: Сборка
        run: >
          pyinstaller --noconfirm --windowed --name Jarvis --icon assets/jarvis.ico
          --add-data "jarvis/ui;jarvis/ui"
          --add-data "jarvis/default_protocols.json;jarvis"
          --collect-all webview
          --collect-all pythonnet
          --collect-all clr_loader
          --hidden-import clr
          --collect-data speech_recognition
          --collect-submodules pycaw
          --collect-submodules comtypes
          --hidden-import pystray._win32
          --hidden-import standard_aifc
          jarvis.py

      - name: Разрешение загрузки .NET из скачанной папки
        shell: pwsh
        run: |
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <runtime>
              <loadFromRemoteSources enabled="true"/>
            </runtime>
          </configuration>
          '@ | Set-Content -Encoding utf8 dist/Jarvis/Jarvis.exe.config

      - name: Проверка .exe как будто скачан из интернета
        shell: pwsh
        run: |
          Copy-Item -Recurse dist/Jarvis $env:RUNNER_TEMP/JarvisTest
          Get-ChildItem -Recurse -File $env:RUNNER_TEMP/JarvisTest | ForEach-Object {
            Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          $p = Start-Process "$env:RUNNER_TEMP/JarvisTest/Jarvis.exe" -ArgumentList "--selftest" -PassThru -Wait
          Get-Content "$env:RUNNER_TEMP/JarvisTest/selftest.log"
          if ($p.ExitCode -ne 0) { throw "Jarvis.exe не запустился (код $($p.ExitCode))" }

      - name: Упаковка
        run: |
          Copy-Item README.md dist/Jarvis/README.md
          Compress-Archive -Path dist/Jarvis -DestinationPath Jarvis-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows
          path: Jarvis-Windows.zip

      - name: Публикация в Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Джарвис v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Скачайте **Jarvis-Windows.zip**, распакуйте и запустите **Jarvis.exe**.
            Если Windows покажет синее окно «Защитник Windows» — нажмите «Подробнее» → «Выполнить в любом случае».
          files: Jarvis-Windows.zip
